<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderful Weather</title>
    <link rel="icon" type="image/x-icon" href="https://static.vecteezy.com/system/resources/previews/009/266/750/non_2x/sun-icon-design-free-png.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Doto:wght,ROND@100..900,100&family=Edu+SA+Hand:wght@400..700&family=Kapakana:wght@300..400&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Oxanium:wght@200..800&family=Playwrite+IT+Moderna:wght@100..400&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

</head>
<body>
    <header>
        <h1>Wonderful Weather</h1>
    </header>
    <div id="search">
        <input type="text" placeholder="Input city here" id="input">
        <button id="enter"><img src="https://cdn-icons-png.flaticon.com/512/10629/10629681.png" height="40px" width="40px"></button>
        <button id="converter">°C</button>
    </div>
    <br>
    <div id="card">
        <h1 id="location"></h3>
        <h2 id="day"></h2>
        <h2 id="temp"></h3>
        <h3 id="max"></h3>
        <h3 id="min"></h3>
        <h3 id="precip"></h3>
        <h3 id="humidity"></h3>
        <h3 id="wind"></h3>
        <br>
        <button id="previous">Previous day</button>
        <button id="next">Next day</button>
        
    </div>
</body>
</html>
